<!doctype html>
<title>Irradia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#eef1ec; --surface:#ffffff; --surface-2:#e3e8e0; --surface-hover:#dbe2d7;
  --border:#cdd6c8; --border-strong:#b7c2b0;
  --ink:#16222b; --ink-soft:#4d5c60; --ink-faint:#7c8a86;
  --primary:#1f3a52; --primary-ink:#eef1ec; --primary-soft:#2c4c69;
  --accent:#d9711f; --accent-ink:#fff7ef; --accent-soft:#f3d9be;
  --good:#3f7d5c; --good-bg:#dcebe1;
  --info:#2f6fb0; --info-bg:#dbe7f3;
  --warn:#a9791f; --warn-bg:#f1e3c2;
  --danger:#b23b3b; --danger-bg:#f3dcdb;
  --radius:10px; --radius-lg:16px;
  --font-display:'Barlow Condensed',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'Cascadia Code',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101820; --surface:#182229; --surface-2:#1f2a32; --surface-hover:#26323b;
    --border:#2c3941; --border-strong:#3c4b54;
    --ink:#e7ede9; --ink-soft:#a9b8b3; --ink-faint:#748480;
    --primary:#25405a; --primary-ink:#eef1ec; --primary-soft:#325574;
    --accent:#e2872f; --accent-ink:#1c1206; --accent-soft:#4a3319;
    --good:#5fae83; --good-bg:#1c3327;
    --info:#6fa8dc; --info-bg:#1c2f42;
    --warn:#d1a53a; --warn-bg:#3a3018;
    --danger:#d9645a; --danger-bg:#3c2321;
  }
}
:root[data-theme="dark"]{
  --bg:#101820; --surface:#182229; --surface-2:#1f2a32; --surface-hover:#26323b;
  --border:#2c3941; --border-strong:#3c4b54;
  --ink:#e7ede9; --ink-soft:#a9b8b3; --ink-faint:#748480;
  --primary:#25405a; --primary-ink:#eef1ec; --primary-soft:#325574;
  --accent:#e2872f; --accent-ink:#1c1206; --accent-soft:#4a3319;
  --good:#5fae83; --good-bg:#1c3327;
  --info:#6fa8dc; --info-bg:#1c2f42;
  --warn:#d1a53a; --warn-bg:#3a3018;
  --danger:#d9645a; --danger-bg:#3c2321;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body);
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:600; text-wrap:balance; margin:0; letter-spacing:.01em;}
p{margin:0;}
button{font-family:inherit; cursor:pointer;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
a{color:inherit;}
::selection{background:var(--accent-soft);}

#app{display:grid; grid-template-columns:248px 1fr; min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{
  background:var(--primary); color:var(--primary-ink); padding:22px 18px 18px;
  display:flex; flex-direction:column; gap:26px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{
  width:34px; height:34px; border-radius:9px; background:var(--accent); color:var(--accent-ink);
  display:flex; align-items:center; justify-content:center; flex:none;
}
.brand-mark svg{width:19px; height:19px;}
.brand-name{font-family:var(--font-display); font-size:22px; font-weight:700; letter-spacing:.02em; color:var(--primary-ink);}
.brand-tag{font-size:11px; color:#b9c8d3; margin-top:1px;}

nav.mainnav{display:flex; flex-direction:column; gap:3px;}
.navlink{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; border:none;
  background:transparent; color:#c9d6de; font-size:14.5px; font-weight:500; text-align:left; width:100%;
  transition:background .12s ease, color .12s ease;
}
.navlink svg{width:17px; height:17px; flex:none; opacity:.9;}
.navlink:hover{background:rgba(255,255,255,.07); color:#fff;}
.navlink.active{background:var(--accent); color:var(--accent-ink); font-weight:600;}
.navlink .count{
  margin-left:auto; font-family:var(--font-mono); font-size:11px; background:rgba(255,255,255,.12);
  padding:1px 6px; border-radius:999px; color:#dbe6ec;
}
.navlink.active .count{background:rgba(0,0,0,.15); color:var(--accent-ink);}

.sidebar-widget{
  margin-top:auto; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.09);
  border-radius:var(--radius); padding:13px 14px;
}
.sidebar-widget h4{font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:#a9bcc7; font-family:var(--font-body); font-weight:600; margin-bottom:9px;}
.deadline-row{display:flex; align-items:baseline; gap:8px; padding:6px 0; border-top:1px solid rgba(255,255,255,.08);}
.deadline-row:first-of-type{border-top:none;}
.deadline-row .dl-title{font-size:12.5px; color:#e3eaee; flex:1; line-height:1.35;}
.deadline-row .dl-days{font-family:var(--font-mono); font-size:11px; color:var(--accent); font-weight:500; white-space:nowrap;}
.sidebar-footnote{font-size:10.5px; color:#8ea3af; margin-top:12px; line-height:1.4;}

/* ---------- Main ---------- */
main{min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--border);
  padding:20px 32px 16px;
}
.topbar-row{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;}
.topbar h1{font-size:28px;}
.topbar .sub{color:var(--ink-soft); font-size:13.5px; margin-top:3px;}
.searchbox{
  display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border);
  border-radius:999px; padding:8px 14px; width:260px; flex:none;
}
.searchbox svg{width:15px; height:15px; color:var(--ink-faint); flex:none;}
.searchbox input{border:none; background:transparent; outline:none; font-size:13.5px; color:var(--ink); width:100%; font-family:var(--font-body);}
.searchbox input::placeholder{color:var(--ink-faint);}

.chiprow{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
.chipgroup{display:flex; gap:6px; padding:3px; background:var(--surface-2); border-radius:999px;}
.chip{
  border:none; background:transparent; color:var(--ink-soft); font-size:12.5px; font-weight:500;
  padding:6px 13px; border-radius:999px; transition:background .12s ease, color .12s ease;
}
.chip:hover{color:var(--ink);}
.chip.active{background:var(--surface); color:var(--primary); box-shadow:0 1px 2px rgba(0,0,0,.08); font-weight:600;}

.content{padding:22px 32px 60px; flex:1;}

/* ---------- Cards / feed ---------- */
.feed-list{display:flex; flex-direction:column; gap:10px; max-width:760px;}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:16px 18px; cursor:pointer; transition:border-color .12s ease, transform .12s ease;
  display:flex; flex-direction:column; gap:8px;
}
.card:hover{border-color:var(--border-strong);}
.card-top{display:flex; align-items:flex-start; gap:10px;}
.pill{
  font-family:var(--font-body); font-size:11px; font-weight:600; letter-spacing:.02em;
  padding:3px 9px; border-radius:999px; white-space:nowrap;
}
.pill-type-bando{background:var(--accent-soft); color:var(--accent);}
.pill-type-norma{background:var(--info-bg); color:var(--info);}
.pill-type-cer{background:var(--good-bg); color:var(--good);}
.pill-ambito{background:var(--surface-2); color:var(--ink-soft); font-weight:500;}
.tone-good{background:var(--good-bg); color:var(--good);}
.tone-info{background:var(--info-bg); color:var(--info);}
.tone-warn{background:var(--warn-bg); color:var(--warn);}
.tone-danger{background:var(--danger-bg); color:var(--danger);}
.card-title{font-family:var(--font-display); font-size:19px; font-weight:600; flex:1; line-height:1.2;}
.star-btn{
  border:none; background:transparent; padding:4px; border-radius:6px; flex:none; color:var(--ink-faint);
  display:flex; align-items:center; justify-content:center;
}
.star-btn:hover{background:var(--surface-2); color:var(--accent);}
.star-btn.saved{color:var(--accent);}
.star-btn svg{width:18px; height:18px;}
.card-meta{display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-soft);}
.card-meta span{display:flex; align-items:center; gap:5px;}
.card-meta b{font-family:var(--font-mono); font-weight:500; color:var(--ink);}
.card-sintesi{font-size:13.5px; color:var(--ink-soft); line-height:1.5;}
.empty-state{padding:40px 20px; text-align:center; color:var(--ink-soft); font-size:14px; max-width:400px;}

/* ---------- Detail view ---------- */
.back-link{
  display:inline-flex; align-items:center; gap:6px; border:none; background:transparent; color:var(--ink-soft);
  font-size:13px; font-weight:500; padding:6px 0; margin-bottom:14px;
}
.back-link:hover{color:var(--accent);}
.back-link svg{width:15px; height:15px;}
.detail-wrap{max-width:720px;}
.detail-pills{display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap;}
.detail-header{display:flex; align-items:flex-start; gap:14px; justify-content:space-between;}
.detail-title{font-size:32px; line-height:1.1;}
.detail-sub{color:var(--ink-soft); font-size:15px; margin-top:6px;}
.detail-meta{
  display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:22px 0;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px;
}
.detail-meta .m-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:600;}
.detail-meta .m-value{font-family:var(--font-mono); font-size:14.5px; margin-top:4px; color:var(--ink);}
.detail-block{margin-top:22px;}
.detail-block h3{font-size:15px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); font-weight:600; margin-bottom:10px;}
.detail-block p{font-size:15px; color:var(--ink); line-height:1.65;}
.req-list{list-style:none; padding:0; display:flex; flex-direction:column; gap:9px;}
.req-list li{display:flex; gap:10px; font-size:14.5px; line-height:1.5;}
.req-list li svg{width:16px; height:16px; flex:none; margin-top:3px; color:var(--good);}
.contrib-box{background:var(--accent-soft); border:1px solid var(--accent); border-radius:var(--radius); padding:14px 16px; margin-top:22px;}
.contrib-box .m-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); font-weight:700;}
.contrib-box p{margin-top:6px; font-size:14.5px; color:var(--ink);}
.detail-actions{display:flex; gap:10px; margin-top:26px; align-items:center;}
.btn{
  display:inline-flex; align-items:center; gap:7px; border-radius:8px; padding:9px 16px; font-size:13.5px;
  font-weight:600; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink);
}
.btn svg{width:15px; height:15px;}
.btn:hover{background:var(--surface-hover);}
.btn-accent{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.btn-accent:hover{filter:brightness(1.06);}
.btn-accent.saved{background:var(--surface); color:var(--accent); border-color:var(--accent);}
.source-note{font-size:12px; color:var(--ink-faint); margin-top:24px; padding-top:16px; border-top:1px solid var(--border);}

/* ---------- Marche ---------- */
.cat-tabs{display:flex; gap:6px; margin-bottom:18px;}
.cat-tab{
  border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); font-weight:600;
  font-size:13.5px; padding:8px 18px; border-radius:8px;
}
.cat-tab.active{background:var(--primary); color:var(--primary-ink); border-color:var(--primary);}
.brand-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; max-width:900px;}
.brand-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:18px; display:flex; flex-direction:column; gap:10px; text-align:left;
}
.brand-card:hover{border-color:var(--border-strong);}
.brand-logo{
  width:44px; height:44px; border-radius:9px; background:var(--primary); color:var(--primary-ink);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:16px;
}
.brand-card .b-name{font-family:var(--font-display); font-size:19px; font-weight:600;}
.brand-card .b-meta{font-size:12px; color:var(--ink-soft);}
.brand-card .b-count{font-family:var(--font-mono); font-size:11.5px; color:var(--accent); font-weight:500;}

.model-list{display:flex; flex-direction:column; gap:10px; max-width:720px;}
.model-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px;
  display:flex; align-items:center; gap:14px; text-align:left;
}
.model-card:hover{border-color:var(--border-strong);}
.model-card .mc-main{flex:1;}
.model-card .mc-name{font-family:var(--font-display); font-size:17px; font-weight:600;}
.model-card .mc-tags{font-size:12px; color:var(--ink-soft); margin-top:3px;}
.model-card .mc-spec{font-family:var(--font-mono); font-size:13px; color:var(--accent); font-weight:500; white-space:nowrap;}
.model-card svg.chev{width:16px; height:16px; color:var(--ink-faint); flex:none;}

/* ---------- Doc / commissioning ---------- */
.doc-header{
  background:var(--primary); color:var(--primary-ink); border-radius:var(--radius-lg); padding:22px 24px; margin-bottom:20px;
}
.doc-header .doc-brand{font-size:12px; color:#b9c8d3; text-transform:uppercase; letter-spacing:.06em; font-weight:600;}
.doc-header h2{font-size:26px; margin-top:4px;}
.doc-header .doc-specs{display:flex; gap:18px; margin-top:12px; flex-wrap:wrap;}
.doc-header .doc-specs span{font-size:12.5px; color:#cddbe2;}
.doc-header .doc-specs b{font-family:var(--font-mono); color:#fff; font-weight:500;}
.doc-rev{font-family:var(--font-mono); font-size:11px; color:#9db3bf; margin-top:12px;}
.doc-section{margin-bottom:20px;}
.doc-section h3{
  font-size:14px; color:var(--ink); font-weight:600; margin-bottom:10px; display:flex; align-items:center; gap:8px;
}
.doc-section h3 .step-no{
  font-family:var(--font-mono); font-size:11px; background:var(--primary); color:var(--primary-ink);
  width:20px; height:20px; border-radius:5px; display:flex; align-items:center; justify-content:center; flex:none;
}
.check-item{
  display:flex; align-items:flex-start; gap:10px; padding:10px 12px; background:var(--surface); border:1px solid var(--border);
  border-radius:8px; margin-bottom:6px; font-size:14px; line-height:1.5;
}
.check-item .box{
  width:18px; height:18px; border-radius:5px; border:1.5px solid var(--border-strong); flex:none; margin-top:1px;
  display:flex; align-items:center; justify-content:center; transition:background .1s, border-color .1s;
}
.check-item .box svg{width:12px; height:12px; color:#fff; opacity:0; transition:opacity .1s;}
.check-item.checked{background:var(--good-bg); border-color:var(--good);}
.check-item.checked .box{background:var(--good); border-color:var(--good);}
.check-item.checked .box svg{opacity:1;}
.check-item.checked span{color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--ink-faint);}

/* ---------- Prima configurazione ---------- */
.pc-header{
  background:var(--accent); color:var(--accent-ink); border-radius:var(--radius-lg); padding:22px 24px; margin-bottom:22px;
}
.pc-header .pc-eyebrow{font-size:12px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; opacity:.85;}
.pc-header h2{font-size:26px; margin-top:4px;}
.pc-header p{margin-top:8px; font-size:14px; opacity:.92; max-width:56ch;}
.pc-list{display:flex; flex-direction:column; gap:0; max-width:640px;}
.pc-step{display:flex; gap:16px; position:relative; padding-bottom:26px;}
.pc-step:last-child{padding-bottom:0;}
.pc-step .pc-num{
  width:32px; height:32px; border-radius:50%; background:var(--surface); border:2px solid var(--accent); color:var(--accent);
  font-family:var(--font-display); font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center;
  flex:none; position:relative; z-index:1;
}
.pc-step:not(:last-child)::before{
  content:''; position:absolute; left:15px; top:32px; bottom:0; width:2px; background:var(--border);
}
.pc-step .pc-text{padding-top:5px; font-size:15px; line-height:1.55; color:var(--ink);}
.pc-source-note{font-size:12px; color:var(--ink-faint); margin-top:28px; padding-top:16px; border-top:1px solid var(--border); max-width:640px;}

/* ---------- Preferiti ---------- */
.pref-row{
  display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:12px 16px; margin-bottom:8px; max-width:720px; text-align:left;
}
.pref-row .pr-main{flex:1;}
.pref-row .pr-title{font-family:var(--font-display); font-size:16.5px; font-weight:600;}
.pref-row .pr-sub{font-size:12px; color:var(--ink-soft); margin-top:2px;}

[hidden]{display:none !important;}

@media print{
  body{background:#fff;}
  .sidebar, .topbar, .chiprow, .back-link, .star-btn, .detail-actions{display:none !important;}
  #app{display:block;}
  main{display:block;}
  .content{padding:0;}
  .detail-wrap{max-width:100%;}
  .doc-header, .contrib-box, .pill, .card, .check-item, .brand-logo, .pc-header, .pc-step .pc-num{
    -webkit-print-color-adjust:exact; print-color-adjust:exact; color-adjust:exact;
  }
  .doc-section{break-inside:avoid-page;}
  .check-item, .pc-step{break-inside:avoid;}
  .source-note{margin-top:12px;}
}
@media (max-width:800px){
  #app{grid-template-columns:1fr;}
  .sidebar{position:static; height:auto; flex-direction:row; align-items:center; gap:14px; padding:14px 16px; overflow:visible;}
  .brand-tag{display:none;}
  nav.mainnav{flex-direction:row; gap:4px;}
  .navlink span.label{display:none;}
  .navlink .count{display:none;}
  .sidebar-widget{display:none;}
  .topbar{padding:16px 18px 12px;}
  .content{padding:16px 18px 50px;}
  .searchbox{width:100%;}
  .topbar-row{flex-direction:column; align-items:stretch;}
  .detail-meta{grid-template-columns:1fr 1fr;}
}
</style>

<div id="app"></div>

<script>

  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',

  starFill:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.65 5.62 6.1.6-4.55 4.3 1.25 6.08L12 16.9l-5.45 3.2 1.25-6.08-4.55-4.3 6.1-.6z"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',

function icon(name){ return ICONS[name] || ''; }

function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'});
}
function typeLabel(type, long){
  if(type === 'bando') return 'Bando';
  if(type === 'cer') return 'CER';
  return long ? 'Norma tecnica' : 'Norma';
}
function daysUntil(iso){
  const today = new Date('2026-09-15T00:00:00');
  const d = new Date(iso+'T00:00:00');
  return Math.round((d - today) / 86400000);
}
function toneForDays(n){
  if(n < 0) return 'danger';
  if(n <= 14) return 'danger';
  if(n <= 45) return 'warn';
  return 'good';
}

function getSaved(){
  try{
    const raw = localStorage.getItem('irradia_saved');
    if(raw === null){
      const seed = [{kind:'update', id:'n1'}, {kind:'model', id:'sma-sthx-1'}];
      localStorage.setItem('irradia_saved', JSON.stringify(seed));
      return seed;
    }
    return JSON.parse(raw);
  }catch(e){ return []; }
}
function setSaved(arr){ try{ localStorage.setItem('irradia_saved', JSON.stringify(arr)); }catch(e){} }
function isSaved(kind, id){ return getSaved().some(s => s.kind === kind && s.id === id); }
function toggleSaved(kind, id){
  let saved = getSaved();
  if(saved.some(s => s.kind===kind && s.id===id)){
    saved = saved.filter(s => !(s.kind===kind && s.id===id));
  } else {
    saved.push({kind, id});
  }
  setSaved(saved);
  render();
}

function navTo(screen){
  state.screen = screen;
  if(screen === 'marche-list'){ state.currentBrandId = null; state.currentModelId = null; }
  render();
}

/* ---------- render helpers ---------- */
function renderUpdateCard(u){
  const days = u.scadenza ? daysUntil(u.scadenza) : null;
  const tone = days !== null ? toneForDays(days) : 'info';
  const dateLabel = u.dateLabel || (u.type === 'bando' ? 'Scadenza' : 'In vigore dal');
  const saved = isSaved('update', u.id);
  const daysText = days === null ? '' : days < 0 ? 'Scaduto' : days === 0 ? 'Scade oggi' : `tra ${days} g`;
  return `
  <div class="card" data-open-update="${u.id}">
    <div class="card-top">
      <span class="pill pill-type-${u.type}">${typeLabel(u.type)}</span>
      <span class="pill pill-ambito">${u.ambito === 'entrambi' ? 'Civile + industriale' : u.ambito === 'civile' ? 'Civile' : 'Industriale'}</span>
      <button class="star-btn ${saved ? 'saved' : ''}" data-toggle-star="update:${u.id}" aria-label="Salva">
        ${saved ? icon('starFill') : icon('star')}
      </button>
    </div>
    <div class="card-title">${u.title}</div>
    <div class="card-sintesi">${u.sottotitolo}</div>
    <div class="card-meta">
      <span>${icon('building')} ${u.ente.split(' –')[0]}</span>
      <span>${icon('calendar')} ${dateLabel}: <b>${u.scadenza ? fmtDate(u.scadenza) : (u.scadenzaNota || 'A sportello')}</b></span>
      ${days !== null ? `<span class="pill tone-${tone}">${daysText}</span>` : (u.type === 'bando' ? `<span class="pill tone-info">A sportello</span>` : '')}
    </div>
  </div>`;
}

function currentFeed(){
  return UPDATES.filter(u => {
    if(state.filterTipo !== 'tutti' && u.type !== state.filterTipo) return false;
    if(state.filterAmbito !== 'tutti' && u.ambito !== 'entrambi' && u.ambito !== state.filterAmbito) return false;
    if(state.query){
      const q = state.query.toLowerCase();
      if(!u.title.toLowerCase().includes(q) && !u.ente.toLowerCase().includes(q) && !u.sottotitolo.toLowerCase().includes(q)) return false;
    }
    return true;
  }).sort((a,b) => new Date(b.pubblicato) - new Date(a.pubblicato));
}

      <p style="margin-top:10px;"><b>Accessori aggiuntivi richiesti:</b> <span class="pill ${m.accessorioRichiesto ? 'tone-warn' : 'tone-good'}">${m.accessorioRichiesto ? m.accessorioRichiesto : 'Nessuno — integrazione nativa'}</span></p>
    </div>` : ''}
    ${category === 'batteria' ? `
    <div class="contrib-box" style="background:var(--good-bg); border-color:var(--good);">
      <div class="m-label" style="color:var(--good);">Abbinamento con inverter</div>
      ${m.compatibiliIds.length ? `
      <p>Compatibile con:</p>
      <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:7px;">
        ${m.compatibiliIds.map(id => {
          const e = modelIndex[id];
          return e ? `<button class="pill pill-ambito" data-open-model="${id}" style="cursor:pointer; border:1px solid var(--border-strong);">${e.brand.nome} ${e.model.nome}</button>` : '';
        }).join('')}
      </div>` : ''}
      <p style="margin-top:10px; color:var(--ink-soft); font-size:13.5px;">${m.incompatibiliNota}</p>
    </div>` : ''}
    ${m.sections.map((sec, si) => `
      <div class="doc-section">
        <h3><span class="step-no">${si+1}</span>${sec.titolo}</h3>
        ${sec.voci.map((v, vi) => {
          const key = m.id + '-' + si + '-' + vi;
          const checked = state.checkedSteps.has(key);
          return `<div class="check-item ${checked?'checked':''}" data-check="${key}">
            <span class="box">${icon('checkSm')}</span>
            <span>${v}</span>
          </div>`;
        }).join('')}
      </div>`).join('')}
    <div class="detail-actions">
      ${m.primaConfig ? `<button class="btn btn-accent" data-open-prima-config="${m.id}">${icon('bolt')} Prima configurazione</button>` : ''}
      <button class="btn ${saved ? 'saved' : ''}" data-toggle-star="model:${m.id}">
        ${saved ? icon('starFill') : icon('star')} ${saved ? 'Salvato nei preferiti' : 'Salva nei preferiti'}
      </button>
      <button class="btn" onclick="window.print()">${icon('print')} Stampa checklist</button>
    </div>
    <div class="source-note">Scheda semplificata a scopo dimostrativo, non sostituisce il manuale ufficiale del costruttore.</div>
  </div>`;
}

function renderPrimaConfig(){
  const entry = modelIndex[state.currentModelId];
  if(!entry) return '';
  const { brand: b, model: m } = entry;
  if(!m.primaConfig) return '';
  return `
  <button class="back-link" data-nav-model="${m.id}">${icon('back')} ${m.nome}</button>
  <div class="detail-wrap">
    <div class="pc-header">
      <div class="pc-eyebrow">${b.nome} · Prima configurazione</div>
      <h2>${m.nome}</h2>
      <p>I passaggi essenziali per la prima accensione e configurazione, riassunti dal manuale ufficiale del costruttore in un linguaggio semplice.</p>
    </div>
    <div class="pc-list">
      ${m.primaConfig.map((step, i) => `
        <div class="pc-step">
          <div class="pc-num">${i+1}</div>
          <div class="pc-text">${step}</div>
        </div>`).join('')}
    </div>
    <div class="detail-actions" style="margin-top:6px;">
      <button class="btn" onclick="window.print()">${icon('print')} Stampa questi passaggi</button>
    </div>
    <div class="pc-source-note">Riassunto a scopo dimostrativo dal manuale d’uso/guida rapida ufficiale ${b.nome}. Per l’installazione fare sempre riferimento al manuale completo del modello esatto in tuo possesso.</div>
  </div>`;
}

function renderPreferiti(){
  const saved = getSaved();
  if(!saved.length){
    return `<div class="empty-state">Non hai ancora salvato nulla. Tocca la stella su un aggiornamento o su una scheda di commissioning per ritrovarla qui.</div>`;
  }
  const rows = saved.map(s => {
    if(s.kind === 'update'){
      const u = updateIndex[s.id];
      if(!u) return '';
      return `<button class="pref-row" data-open-update="${u.id}">
        <div class="pr-main">
          <div class="pr-title">${u.title}</div>
          <div class="pr-sub">${typeLabel(u.type)} · ${u.ente.split(' –')[0]}</div>
        </div>
        <button class="star-btn saved" data-toggle-star="update:${u.id}" aria-label="Rimuovi">${icon('starFill')}</button>
      </button>`;
    } else {
      const entry = modelIndex[s.id];
      if(!entry) return '';
      return `<button class="pref-row" data-open-model="${entry.model.id}">
        <div class="pr-main">
          <div class="pr-title">${entry.model.nome}</div>
          <div class="pr-sub">${entry.brand.nome} · Scheda di commissioning</div>
        </div>
        <button class="star-btn saved" data-toggle-star="model:${entry.model.id}" aria-label="Rimuovi">${icon('starFill')}</button>
      </button>`;
    }
  }).join('');
  return `<div class="feed-list">${rows}</div>`;
}

function topbarFor(){
  if(state.screen === 'feed-list' || state.screen === 'feed-detail'){
    return { title:'Aggiornamenti', sub:'Bandi e norme tecniche per il fotovoltaico, civile e industriale', showSearch: state.screen==='feed-list' };
  }
  if(state.screen.startsWith('marche')){
    return { title:'Marche & commissioning', sub:'Inverter e batterie: schede semplificate di messa in servizio', showSearch:false };
  }
  return { title:'Preferiti', sub:'Aggiornamenti e schede che hai salvato', showSearch:false };
}

function upcomingDeadlines(){
  return UPDATES.filter(u => u.scadenza && daysUntil(u.scadenza) >= 0)
    .sort((a,b) => daysUntil(a.scadenza) - daysUntil(b.scadenza))
    .slice(0,3);
}

function render(){
  const tb = topbarFor();
  const deadlines = upcomingDeadlines();
  let body = '';
  if(state.screen === 'feed-list') body = renderFeedList();
  else if(state.screen === 'feed-detail') body = renderUpdateDetail();
  else if(state.screen === 'marche-list') body = renderMarcheList();
  else if(state.screen === 'marche-brand') body = renderBrandDetail();
  else if(state.screen === 'marche-model') body = renderModelDoc();
  else if(state.screen === 'marche-prima-config') body = renderPrimaConfig();
  else if(state.screen === 'preferiti') body = renderPreferiti();

  document.getElementById('app').innerHTML = `
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">${icon('sun')}</div>
        <div>
          <div class="brand-name">Irradia</div>
          <div class="brand-tag">Intelligence per il fotovoltaico</div>
        </div>
      </div>
      <nav class="mainnav">
        <button class="navlink ${state.screen.startsWith('feed')?'active':''}" data-nav="feed-list">${icon('feed')}<span class="label">Aggiornamenti</span><span class="count">${UPDATES.length}</span></button>
        <button class="navlink ${state.screen.startsWith('marche')?'active':''}" data-nav="marche-list">${icon('grid')}<span class="label">Marche & commissioning</span></button>
        <button class="navlink ${state.screen==='preferiti'?'active':''}" data-nav="preferiti">${icon('star')}<span class="label">Preferiti</span><span class="count">${getSaved().length}</span></button>
      </nav>
      <div class="sidebar-widget">
        <h4>Prossime scadenze</h4>
        ${deadlines.map(u => `<div class="deadline-row"><span class="dl-title">${u.title}</span><span class="dl-days">${daysUntil(u.scadenza)} g</span></div>`).join('')}
        <div class="sidebar-footnote">Prototipo interattivo — bandi, norme e schede sono contenuti di esempio.</div>
      </div>
    </aside>
    <main>
      <div class="topbar">
        <div class="topbar-row">
          <div>
            <h1>${tb.title}</h1>
            <div class="sub">${tb.sub}</div>
          </div>
          ${tb.showSearch ? `
          <div class="searchbox">
            ${icon('search')}
            <input type="text" id="search-input" placeholder="Cerca per titolo o ente…" value="${state.query.replace(/"/g,'&quot;')}">
          </div>` : ''}
        </div>
      </div>
      <div class="content">${body}</div>
    </main>`;

  wireEvents();
}

function wireEvents(){
  const app = document.getElementById('app');
  app.addEventListener('click', onAppClick);
  const search = document.getElementById('search-input');
  if(search){
    search.addEventListener('input', e => { state.query = e.target.value; renderKeepFocus(); });
  }
}

function renderKeepFocus(){
  render();
  const search = document.getElementById('search-input');
  if(search){
    search.focus();
    const val = search.value;
    search.value = '';
    search.value = val;
  }
}

function onAppClick(e){
  const navBtn = e.target.closest('[data-nav]');
  const navBrand = e.target.closest('[data-nav-brand]');
  const navModel = e.target.closest('[data-nav-model]');
  const openUpdate = e.target.closest('[data-open-update]');
  const openBrand = e.target.closest('[data-open-brand]');
  const openModel = e.target.closest('[data-open-model]');
  const openPrimaConfig = e.target.closest('[data-open-prima-config]');
  const starBtn = e.target.closest('[data-toggle-star]');
  const filterTipo = e.target.closest('[data-filter-tipo]');
  const filterAmbito = e.target.closest('[data-filter-ambito]');
  const catTab = e.target.closest('[data-cat]');
  const checkItem = e.target.closest('[data-check]');

  if(starBtn){
    e.stopPropagation();
    const [kind, id] = starBtn.getAttribute('data-toggle-star').split(':');
    toggleSaved(kind, id);
    return;
  }
  if(checkItem){
    const key = checkItem.getAttribute('data-check');
    if(state.checkedSteps.has(key)) state.checkedSteps.delete(key);
    else state.checkedSteps.add(key);
    render();
    return;
  }
  if(navBtn){ navTo(navBtn.getAttribute('data-nav')); return; }
  if(navBrand){ state.screen = 'marche-brand'; state.currentBrandId = navBrand.getAttribute('data-nav-brand'); render(); return; }
  if(navModel){ state.screen = 'marche-model'; state.currentModelId = navModel.getAttribute('data-nav-model'); render(); return; }
  if(openPrimaConfig){ state.screen = 'marche-prima-config'; state.currentModelId = openPrimaConfig.getAttribute('data-open-prima-config'); render(); return; }
  if(openUpdate){ state.screen = 'feed-detail'; state.currentUpdateId = openUpdate.getAttribute('data-open-update'); render(); return; }
  if(openBrand){ state.screen = 'marche-brand'; state.currentBrandId = openBrand.getAttribute('data-open-brand'); render(); return; }
  if(openModel){
    const id = openModel.getAttribute('data-open-model');
    state.screen = 'marche-model';
    state.currentModelId = id;
    if(!state.currentBrandId){ state.currentBrandId = modelIndex[id].brand.id; }
    render();
    return;
  }
  if(filterTipo){ state.filterTipo = filterTipo.getAttribute('data-filter-tipo'); render(); return; }
  if(filterAmbito){ state.filterAmbito = filterAmbito.getAttribute('data-filter-ambito'); render(); return; }
  if(catTab){ state.marcheCategory = catTab.getAttribute('data-cat'); render(); return; }
}

render();
</script>
